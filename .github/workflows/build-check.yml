name: build-check

# Fails the build if the committed resources/dist bundle is stale.
# resources/dist is shipped via Composer (no npm at install time), so it must
# always match current source. See scripts/check-dist-fresh.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  STATAMIC_CMS_VERSION: '6.42.0'

jobs:
  dist-fresh:
    runs-on: ubuntu-latest
    name: Committed dist is fresh (npm ci + build diff)
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # The committed bundle inlines code from the @statamic/cms npm package,
      # which comes from the installed statamic/cms Composer package. composer.lock
      # is not committed, so an unpinned install pulls whatever Statamic released
      # last and the fresh build drifts from the committed dist with no source
      # change (6.42.0 -> 6.44.0 did exactly that). Pin the version the dist was
      # built against. To bump: change STATAMIC_CMS_VERSION, `composer require
      # statamic/cms:<v> -W --no-update && composer update`, `npm ci && npm run
      # build`, commit resources/dist together with this file.
      - name: Pin statamic/cms to the dist build version
        run: composer require "statamic/cms:${STATAMIC_CMS_VERSION}" --no-update --no-interaction

      # @statamic/cms is a `file:` npm dependency resolved from the installed
      # Composer package, so Composer must run before npm.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies (reproducible)
        run: npm ci

      - name: Verify committed resources/dist is fresh
        run: npm run build:check
