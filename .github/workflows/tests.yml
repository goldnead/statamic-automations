name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [11, 12]
        dependencies: [highest]
        # Note: a `--prefer-lowest` job was tried but Orchestra Testbench
        # 9.0.1 (the lowest constraint that resolves) is missing
        # API-test plumbing (`$latestResponse` static property) that
        # later 9.x patch releases added. Re-introducing the lowest job
        # is tracked separately; for now we cover the realistic supported
        # surface of PHP 8.2/8.3/8.4 × Laravel 11/12 at highest.

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Pin Laravel version
        run: |
          composer require --dev --no-update \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:$( [ "${{ matrix.laravel }}" = "11" ] && echo "^9.0" || echo "^10.0" )"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always
