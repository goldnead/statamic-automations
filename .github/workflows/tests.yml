name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pest:
    # The matrix now varies the two things composer.json actually promises:
    # PHP and Laravel. It used to vary PHP × Statamic 6.*, which is one value,
    # so `laravel/framework: ^11|^12|^13` was a claim nothing ever tested.
    #
    # Laravel 11 is gone from the constraint entirely — v11.0.0 through
    # v11.55.0 are covered by security advisories and Composer refuses the
    # line, so it was never installable, let alone untested.
    #
    # Every cell below was resolved with `composer update --dry-run` against a
    # pinned `config.platform.php` before this file was committed. The one
    # combination that does not resolve is excluded rather than left to fail.
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 needs PHP 8.3+. The assumption that the earliest 13.x tags
          # still install on 8.2 was tested on 01.08.2026 and is wrong — the
          # prefer-lowest cell fails resolution too ("Your requirements could not
          # be resolved"). Both 8.2 × ^13.0 cells are dropped rather than left red;
          # PHP 8.2 stays covered by the whole ^12.0 column.
          - php: '8.2'
            laravel: '^13.0'
            stability: prefer-stable
          - php: '8.2'
            laravel: '^13.0'
            stability: prefer-lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_sqlite, sqlite3, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.laravel }}-
            composer-${{ matrix.php }}-

      - name: Pin Laravel for this matrix cell
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-stable --prefer-dist --no-progress --no-interaction

      # `composer show` nimmt genau ein Paket und optional eine Version -- zwei Pakete
      # liest es als Paket + Version und bricht mit "Too many arguments" ab. Ein
      # Diagnoseschritt, der die Zelle rot macht, die er erklaeren soll, ist schlimmer
      # als keiner.
      - name: Show what was resolved
        run: |
          for pkg in laravel/framework statamic/cms; do
            composer show "$pkg" | grep -E '^(name|versions)'
          done

      - name: Run Pest test suite
        run: vendor/bin/pest --colors=always

  mysql:
    # phpunit.mysql.xml has existed since 1.5 and no workflow had ever run it.
    # SQLite cannot see InnoDB's 3072-byte index limit, what `->change()` does
    # on a typed engine, or a NOT NULL a backfill fails to satisfy — the class
    # of defect that took statamic-notifications v1.0.3 down on production.
    name: MySQL (the suite against a real engine)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: automations_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, mysqli, intl, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; then exit 0; fi
            sleep 2
          done
          echo "MySQL never became reachable" >&2
          exit 1

      - name: Run the suite on MySQL
        run: vendor/bin/pest -c phpunit.mysql.xml --colors=always

  javascript:
    # The JS cases existed and no workflow ran them. The Vue layer is the whole
    # product surface, so its tests were decorative in CI.
    name: JavaScript (node --test + Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # @statamic/cms is a `file:` npm dependency resolved out of the installed
      # Composer package, so Composer must run before npm.
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Pure composables (node --test)
        run: npm run test:js

      - name: Mounted components (Vitest)
        run: npm test
