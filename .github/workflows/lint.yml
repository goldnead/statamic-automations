name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  style:
    runs-on: ubuntu-latest
    name: Code style (Pint)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Check, never fix. Auto-committing style onto a contributor's branch
      # rewrites their work without asking, and means the repo never actually
      # enforces "formatted before merge" — it only repairs afterwards.
      - name: Pint
        run: vendor/bin/pint --test

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis (PHPStan / Larastan)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Level 5 with a committed baseline: a ratchet for new code, not a
      # rewrite of the 18k lines already here. Never regenerate the baseline to
      # turn a red build green — raise the level and shrink it instead.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress

  composer-validate:
    runs-on: ubuntu-latest
    name: Validate composer.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
