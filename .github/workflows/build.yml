name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    name: Frontend (Vite + Vue 3)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: 'npm'` because we don't commit package-lock.json
          # (library convention). The manual cache step below keeps
          # subsequent runs fast.

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build production bundle
        run: npm run build

      - name: Verify build output
        run: |
          test -f resources/dist/cp.js
          test -s resources/dist/cp.js
          echo "✓ resources/dist/cp.js exists ($(wc -c < resources/dist/cp.js) bytes)"

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cp-assets-${{ github.sha }}
          path: resources/dist/
          retention-days: 14
          if-no-files-found: error
